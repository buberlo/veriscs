name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 tools/test_scs.py
      - name: Baseline report without the verified executable
        run: python3 tools/benchmark.py --skip-veriscs --out /tmp/baselines.md --instances /tmp/instances

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake packages and oleans
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-v4.34.1-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'lakefile.lean') }}
      - name: Fetch mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
      - name: Build veriscs
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          # One Lean process at a time. Importing Mathlib is the memory peak.
          lake build veriscs -j1
      - name: Axiom print
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake env lean VeriSCS/Axioms.lean
      - name: Round-trip and one verified instance
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          BIN=".lake/build/bin/veriscs"
          "$BIN" --roundtrip tests/instances/ab_bc.txt | cmp - tests/instances/ab_bc.txt
          "$BIN" --stats tests/instances/one.txt | python3 tools/checker.py tests/instances/one.txt -
          "$BIN" --stats tests/instances/ab_bc.txt | python3 tools/checker.py tests/instances/ab_bc.txt -
